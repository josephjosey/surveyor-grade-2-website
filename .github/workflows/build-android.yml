name: Build Android APK & Google Play AAB Bundle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK & Play Store AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: npm ci

      - name: Compile Production Web Bundle
        run: npm run build

      - name: Synchronize Capacitor Android Platform
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Compile Universal Debug APK (Direct Phone Installation)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Compile Release AAB Bundle (For Google Play Store)
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Prepare Named Binaries
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/SurveyRankAcademy.apk
          cp android/app/build/outputs/bundle/release/app-release.aab build-output/SurveyRankAcademy.aab

      - name: Upload Universal Installable APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: SurveyRankAcademy-DirectInstall-APK
          path: build-output/SurveyRankAcademy.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Google Play Store Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: SurveyRankAcademy-PlayStore-AAB
          path: build-output/SurveyRankAcademy.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish Public GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "SurveyRank Academy Android App (APK & AAB)"
          body: |
            ### 📱 SurveyRank Academy Android App v1.0.0
            
            - **Direct APK Download**: Download [`SurveyRankAcademy.apk`](https://github.com/josephjosey/surveyor-grade-2-website/releases/download/v1.0.0/SurveyRankAcademy.apk) to install immediately on your Android phone!
            - **Google Play Store Bundle**: [`SurveyRankAcademy.aab`](https://github.com/josephjosey/surveyor-grade-2-website/releases/download/v1.0.0/SurveyRankAcademy.aab) for Google Play Console submission.
            - **Features**: 1,089+ Kerala PSC Survey & Land Records Questions, 11 Timed Mock Tests, and State Rank Leaderboards.
          files: |
            build-output/SurveyRankAcademy.apk
            build-output/SurveyRankAcademy.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
